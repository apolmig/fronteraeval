[build]
  base = "/"
  publish = "site"
  command = "npm run build && npm run check && node --test scripts/test-runtime-recovery.mjs scripts/test-freshness.mjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"
