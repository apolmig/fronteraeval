name: Apply simplicity, humility, and data-quality review

on:
  push:
    branches: [product/simplify-and-humility]

permissions:
  contents: write

concurrency:
  group: apply-simplify-humility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/simplify-and-humility
          fetch-depth: 0

      - name: Apply reviewed source tree
        run: |
          base64 --decode tools/simplify-humility-payload.b64 > /tmp/fronteraeval-simplify-humility.tar.gz
          echo 'dd8d5d9f708d26758cdb078076b6aa65117514b79c6e02b6c65e0267b1438ea1  /tmp/fronteraeval-simplify-humility.tar.gz' | sha256sum --check
          tar -xzf /tmp/fronteraeval-simplify-humility.tar.gz -C .
          rm tools/simplify-humility-payload.b64
          rm .github/workflows/apply-simplify-humility.yml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Refresh current upstream catalogue and source registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REFRESH_INSPECT: '1'
        run: npm run refresh:sources

      - name: Run structural, provenance, search, product, and epistemic quality gates
        run: npm run check

      - name: Write validated refresh marker
        run: node scripts/write-refresh-marker.mjs

      - name: Commit reviewed implementation and refreshed registry
        run: |
          git config user.name 'fronteraeval-bot'
          git config user.email 'fronteraeval-bot@users.noreply.github.com'
          git add -A
          git commit -m 'Simplify the product and make uncertainty explicit'
          git push origin HEAD:product/simplify-and-humility
