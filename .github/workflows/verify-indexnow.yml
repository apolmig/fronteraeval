name: Verify IndexNow after discovery deployment

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-indexnow.yml"

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Submit deployed canonical URLs
        run: node scripts/submit-indexnow.mjs
      - name: Remove one-time verification workflow
        if: always()
        run: |
          rm .github/workflows/verify-indexnow.yml
          git config user.name "fronteraeval-bot"
          git config user.email "fronteraeval-bot@users.noreply.github.com"
          git add -A
          git commit -m "Remove one-time IndexNow verification workflow" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
