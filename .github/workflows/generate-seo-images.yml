name: Generate FronteraEval social and icon assets

on:
  push:
    branches: [seo/discovery-social-sharing]
    paths:
      - ".github/workflows/generate-seo-images.yml"

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: seo/discovery-social-sharing
          fetch-depth: 0

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Render social card and icons
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path

          out=Path('site'); out.mkdir(exist_ok=True)
          BG='#f7f5ef'; INK='#191917'; MUTED='#6b685f'; RED='#a13427'; LINE='#d9d4c9'; WHITE='#fffdfa'
          serif='/usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf'
          serif_bold='/usr/share/fonts/truetype/dejavu/DejaVuSerif-Bold.ttf'
          sans='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          sans_bold='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'

          card=Image.new('RGB',(1200,630),BG)
          d=ImageDraw.Draw(card)
          d.rectangle((0,0,1200,10),fill=RED)
          d.line((72,92,1128,92),fill=LINE,width=2)
          d.text((72,47),'FRONTIER AI EVALUATION INDEX',font=ImageFont.truetype(sans_bold,20),fill=RED)
          d.text((72,128),'Frontera',font=ImageFont.truetype(serif_bold,82),fill=INK)
          x=72+d.textlength('Frontera',font=ImageFont.truetype(serif_bold,82))
          d.text((x,128),'Eval',font=ImageFont.truetype(serif_bold,82),fill=RED)
          d.text((72,245),'A source-linked map of frontier AI evaluations.',font=ImageFont.truetype(serif,36),fill=INK)
          d.text((72,306),'Find the evaluation. Read the evidence. Follow the source.',font=ImageFont.truetype(sans,23),fill=MUTED)
          labels=['Capability','Protocol','Evidence','Decision']
          starts=[72,335,598,861]
          for i,(label,left) in enumerate(zip(labels,starts)):
              d.rounded_rectangle((left,390,left+220,455),radius=9,outline=LINE,width=2,fill=WHITE)
              d.ellipse((left+18,414,left+30,426),fill=RED if i==0 else INK)
              d.text((left+43,406),label,font=ImageFont.truetype(sans_bold,20),fill=INK)
              if i < 3:
                  d.line((left+224,422,left+255,422),fill=MUTED,width=2)
                  d.polygon([(left+255,422),(left+246,416),(left+246,428)],fill=MUTED)
          d.line((72,520,1128,520),fill=LINE,width=2)
          d.text((72,548),'fronteraeval.org',font=ImageFont.truetype(sans_bold,23),fill=INK)
          d.text((1128,548),'Open · source-linked · updated weekly',anchor='ra',font=ImageFont.truetype(sans,19),fill=MUTED)
          card.save(out/'social-card.png',optimize=True)

          def icon(size,filename):
              im=Image.new('RGB',(size,size),INK); draw=ImageDraw.Draw(im)
              radius=max(18,int(size*.19)); draw.rounded_rectangle((0,0,size-1,size-1),radius=radius,fill=INK)
              font=ImageFont.truetype(serif_bold,int(size*.35))
              draw.text((size/2,size*.52),'FE',anchor='mm',font=font,fill=BG)
              r=max(4,int(size*.045)); draw.ellipse((size*.78-r,size*.20-r,size*.78+r,size*.20+r),fill=RED)
              im.save(out/filename,optimize=True)
          icon(192,'icon-192.png'); icon(512,'icon-512.png'); icon(180,'apple-touch-icon.png')

          check=Image.open(out/'social-card.png')
          assert check.size==(1200,630) and check.mode=='RGB'
          PY

      - name: Commit durable assets and remove one-time workflow
        run: |
          rm .github/workflows/generate-seo-images.yml
          git config user.name 'fronteraeval-bot'
          git config user.email 'fronteraeval-bot@users.noreply.github.com'
          git add site/social-card.png site/icon-192.png site/icon-512.png site/apple-touch-icon.png .github/workflows/generate-seo-images.yml
          git commit -m 'Add FronteraEval social card and icons'
          git push origin HEAD:seo/discovery-social-sharing
