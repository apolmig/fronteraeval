name: Bootstrap source registry v2

on:
  push:
    branches: [audit/source-resolution-v2]

permissions:
  contents: write

concurrency:
  group: bootstrap-source-registry-v2
  cancel-in-progress: true

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/source-resolution-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Resolve source papers and organisations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REFRESH_INSPECT: "1"
        run: npm run refresh:sources

      - name: Run all quality gates
        run: npm run check

      - name: Remove one-time bootstrap workflow
        run: rm .github/workflows/bootstrap-source-registry.yml

      - name: Commit generated source registry
        run: |
          git config user.name "fronteraeval-bot"
          git config user.email "fronteraeval-bot@users.noreply.github.com"
          git add -A package-lock.json data/source-registry.json .github/workflows/bootstrap-source-registry.yml
          git commit -m "data: resolve source papers and organisations"
          git push origin HEAD:audit/source-resolution-v2
