name: Bootstrap source registry v2

on:
  push:
    branches:
      - audit/source-resolution-v2
      - fix/source-registry-bootstrap
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-source-registry-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies and create lockfile
        run: npm install --no-audit --no-fund

      - name: Resolve source papers, authors and organisations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REFRESH_INSPECT: "1"
        run: npm run refresh:sources

      - name: Run all quality gates
        run: npm run check

      - name: Remove one-time bootstrap workflow
        run: rm .github/workflows/bootstrap-source-registry.yml

      - name: Commit generated source registry and lockfile
        run: |
          git config user.name "fronteraeval-bot"
          git config user.email "fronteraeval-bot@users.noreply.github.com"
          git add -A package-lock.json data/source-registry.json .github/workflows/bootstrap-source-registry.yml
          git commit -m "data: resolve source papers, authors and organisations"
          git push origin HEAD:${{ github.ref_name }}
