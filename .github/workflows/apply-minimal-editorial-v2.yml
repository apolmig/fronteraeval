name: Stage minimal editorial interface

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  stage:
    if: github.event_name == 'push' || github.head_ref == 'design/minimal-editorial-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/minimal-editorial-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore reviewed design bundle
        env:
          GH_TOKEN: ${{ github.token }}
          CHUNK_SHAS: >-
            1eeca30c27d52a35a836c243089e7897d618936f
            cdc7444c43daf1fc8df6c4a43af52bc8b2fec8b3
            b34c4e85871f6b8135ddfffca5a6c500b2ffff0c
            d4cb4bf6f80cad13fffb527f32aff27049da88bf
            9ad1b215c752163bb3942002b869858083ff45e2
            e09cca1cf79f66576d8ac3fe7cd01a7c1605c4e7
            1d5689a4d14f2723bb493acfc6315124c1046701
        run: |
          set -euo pipefail
          : > design.b64
          index=0
          for sha in $CHUNK_SHAS; do
            curl --fail-with-body --silent --show-error \
              --header "authorization: Bearer $GH_TOKEN" \
              --header "accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/blobs/$sha" > blob.json
            INDEX="$index" python - <<'PY'
          import base64, json, os
          data=json.load(open('blob.json'))
          chunk=base64.b64decode(data['content'])
          path=f"chunk-{int(os.environ['INDEX']):02d}.txt"
          open(path,'wb').write(chunk)
          with open('design.b64','ab') as out:
              out.write(chunk)
          PY
            index=$((index + 1))
          done
          cat > chunk-checksums.txt <<'EOF'
          08dc9edb1874b1cf2d1a77b8c77f8da6f6257b45767734a9ce6ab5bdf9b37297  chunk-00.txt
          080cb3d0a5fc249d4a795d0ba07aba552798b813428dbaa5764c5781dd6c480f  chunk-01.txt
          6cb491cbf7490e825f1b0b5f009e591bef575a93f31d018d88131d807aa6f554  chunk-02.txt
          1aae889fb08bb879b1fb59f816220e0d6103fae1ef3c8222fdbf8c2b6705f287  chunk-03.txt
          c0b694220f0f2181926f1ad585b05de3c9fea7b5ec2a47269eb0cc11c281b36d  chunk-04.txt
          bd3b915600166601a2e3b94bcdd69709764f1d9af1815970bc2564245068fad6  chunk-05.txt
          773038d8034f7f5723962557ba4709e159480026077539c1abb946ebe888a042  chunk-06.txt
          EOF
          sha256sum --check chunk-checksums.txt
          base64 --decode design.b64 > design.tar.gz
          echo "cbb767f8077ef41e55b6da2a4ad34dbefa8e9fcc65951573039ca48437c03bd8  design.tar.gz" | sha256sum --check
          tar -xzf design.tar.gz
          rm -f blob.json design.b64 design.tar.gz chunk-*.txt chunk-checksums.txt
      - name: Validate application and generated catalogue
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm run check
      - name: Commit reviewed redesign to its branch
        run: |
          git config user.name "FronteraEval automation"
          git config user.email "actions@users.noreply.github.com"
          git add README.md REDESIGN.md site/app.js site/index.html site/styles.css
          git diff --cached --quiet && exit 0
          git commit -m "Design: compact conceptual editorial interface"
          git push origin HEAD:design/minimal-editorial-v2
