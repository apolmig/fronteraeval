name: Apply data usefulness audit

on:
  push:
    branches: [product/data-usefulness-audit]

permissions:
  contents: write

concurrency:
  group: apply-data-usefulness-audit
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/data-usefulness-audit
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply reviewed patch
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/apply_data_usefulness_patch.py
          python /tmp/apply_data_usefulness_patch.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Refresh and validate catalogue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REFRESH_INSPECT: '1'
        run: |
          npm run refresh:sources
          npm run check
          npm run audit:links -- --fail-critical
          node scripts/write-refresh-marker.mjs

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/apply-data-usefulness-audit.yml
          git config user.name 'fronteraeval-bot'
          git config user.email 'fronteraeval-bot@users.noreply.github.com'
          git add -A
          git commit -m 'Harden catalogue usefulness and source health'
          git push origin HEAD:product/data-usefulness-audit
