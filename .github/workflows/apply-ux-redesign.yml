name: Apply source-first UX redesign

on:
  push:
    branches: [design/ux-information-architecture-v3]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/ux-information-architecture-v3
      - name: Apply verified redesign bundle
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/fronteraeval-redesign.b64 <<'PAYLOAD'
[... ELLIPSIZATION ...]
PAYLOAD
          base64 --decode /tmp/fronteraeval-redesign.b64 | tar -xJf -
          rm -f .github/workflows/apply-ux-redesign.yml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Validate generated catalogue and UI source
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run check
      - name: Commit redesigned product
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Redesign: source-first evaluation explorer"
          git push origin HEAD:design/ux-information-architecture-v3
