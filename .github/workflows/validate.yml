name: Validate FronteraEval

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Regenerate upstream catalogue and source registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REFRESH_INSPECT: "1"
        run: npm run refresh:sources
      - name: Run structural, source-resolution, construct and search quality gates
        run: npm run check
      - name: Publish verified deploy source
        uses: actions/upload-artifact@v4
        with:
          name: fronteraeval-deploy-${{ github.sha }}
          retention-days: 3
          if-no-files-found: error
          path: |
            .gitignore
            README.md
            ATTRIBUTION.md
            netlify.toml
            package.json
            package-lock.json
            data
            scripts
            netlify
            site
