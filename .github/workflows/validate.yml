name: Validate FronteraEval

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate catalogue and validate
        run: npm run build && npm run check
      - name: Publish verified deploy source
        uses: actions/upload-artifact@v4
        with:
          name: fronteraeval-deploy-${{ github.sha }}
          retention-days: 3
          if-no-files-found: error
          path: |
            .gitignore
            README.md
            REDESIGN.md
            netlify.toml
            package.json
            scripts
            netlify
            site
