name: Weekly catalogue and source refresh

on:
  schedule:
    - cron: "23 2 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-catalogue-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Refresh upstream catalogue, papers, authors and organisations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REFRESH_INSPECT: "1"
        run: npm run refresh:sources

      - name: Run structural, source-resolution, construct and search quality gates
        run: npm run check

      - name: Write validated refresh marker
        run: node scripts/write-refresh-marker.mjs

      - name: Commit updated registry and refresh marker
        run: |
          git config user.name "fronteraeval-bot"
          git config user.email "fronteraeval-bot@users.noreply.github.com"
          git add data/source-registry.json refresh/last-run.json
          git commit -m "chore: weekly catalogue and source refresh" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
