name: Weekly catalogue and source refresh

on:
  schedule:
    - cron: "23 2 * * 0"
    - cron: "23 8 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: weekly-catalogue-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Skip the backup run only after a verified primary deployment
        id: guard
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          should_run=true
          if [[ "$EVENT_NAME" == "schedule" && "$EVENT_SCHEDULE" == "23 8 * * 0" && -f refresh/last-run.json ]]; then
            expected="$(node --input-type=module -e 'import fs from "node:fs"; const marker=JSON.parse(fs.readFileSync("refresh/last-run.json","utf8")); process.stdout.write(marker.refreshed_at || "")')"
            recent="$(EXPECTED="$expected" node --input-type=module -e 'const value=Date.parse(process.env.EXPECTED || ""); process.stdout.write(Number.isFinite(value) && Date.now()-value < 10*60*60*1000 ? "true" : "false")')"
            if [[ "$recent" == "true" ]] && curl -fsS --retry 2 --retry-all-errors --max-time 20 "https://fronteraeval.org/data/weekly-refresh.json?backup-check=$(date +%s)" -o /tmp/weekly-refresh.json; then
              if EXPECTED="$expected" node --input-type=module -e 'import fs from "node:fs"; const remote=JSON.parse(fs.readFileSync("/tmp/weekly-refresh.json","utf8")); process.exit(remote.refreshed_at === process.env.EXPECTED ? 0 : 1)'; then
                should_run=false
                echo "Primary refresh and production deployment are already current; backup run is not needed."
              fi
            fi
          fi
          echo "run=$should_run" >> "$GITHUB_OUTPUT"

      - name: Install locked dependencies with retries
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci --no-audit --no-fund; then
              exit 0
            fi
            [[ "$attempt" -lt 3 ]] && sleep "$((attempt * 15))"
          done
          exit 1

      - name: Refresh upstream catalogue, papers, authors and organisations
        if: steps.guard.outputs.run == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REFRESH_INSPECT: "1"
        run: |
          for attempt in 1 2 3; do
            if npm run refresh:sources; then
              exit 0
            fi
            [[ "$attempt" -lt 3 ]] && sleep "$((attempt * 20))"
          done
          exit 1

      - name: Run structural, source-resolution, construct, search, review, discovery, and usefulness gates
        if: steps.guard.outputs.run == 'true'
        run: npm run check

      - name: Audit primary and methodological-review sources
        if: steps.guard.outputs.run == 'true'
        shell: bash
        env:
          SOURCE_AUDIT_CONCURRENCY: "8"
        run: |
          for attempt in 1 2; do
            if npm run audit:links -- --fail-critical; then
              exit 0
            fi
            [[ "$attempt" -lt 2 ]] && sleep 30
          done
          exit 1

      - name: Write validated refresh marker
        if: steps.guard.outputs.run == 'true'
        run: node scripts/write-refresh-marker.mjs

      - name: Commit and push the validated refresh
        if: steps.guard.outputs.run == 'true'
        id: commit
        shell: bash
        run: |
          git config user.name "fronteraeval-bot"
          git config user.email "fronteraeval-bot@users.noreply.github.com"
          git add data/source-registry.json refresh/last-run.json refresh/source-link-audit.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: weekly catalogue and source refresh"
          # Deploy-time site/data and static discovery pages are regenerated by Netlify.
          # Discard those non-versioned files before rebasing the persistent refresh state.
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git reset --hard HEAD
            git clean -fd
            [[ "$attempt" -lt 3 ]] && sleep "$((attempt * 20))"
          done
          exit 1

      - name: Verify the production deployment contains this refresh
        if: steps.guard.outputs.run == 'true' && steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          expected="$(node --input-type=module -e 'import fs from "node:fs"; const marker=JSON.parse(fs.readFileSync("refresh/last-run.json","utf8")); process.stdout.write(marker.refreshed_at)')"
          verified=false
          for attempt in $(seq 1 30); do
            if curl -fsS --retry 2 --retry-all-errors --max-time 20 "https://fronteraeval.org/data/weekly-refresh.json?deploy-check=$(date +%s)" -o /tmp/weekly-refresh.json; then
              if EXPECTED="$expected" node --input-type=module -e 'import fs from "node:fs"; const remote=JSON.parse(fs.readFileSync("/tmp/weekly-refresh.json","utf8")); process.exit(remote.refreshed_at === process.env.EXPECTED ? 0 : 1)'; then
                verified=true
                break
              fi
            fi
            sleep 20
          done
          if [[ "$verified" != "true" ]]; then
            echo "Production did not expose refresh marker $expected within ten minutes."
            exit 1
          fi
          curl -fsS --retry 3 --retry-all-errors --max-time 20 https://fronteraeval.org/ >/dev/null

      - name: Verify public SEO, sharing, and discovery surfaces
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          curl -fsS --retry 3 --retry-all-errors --max-time 25 https://fronteraeval.org/ -o /tmp/home.html
          curl -fsS --retry 3 --retry-all-errors --max-time 25 https://fronteraeval.org/robots.txt -o /tmp/robots.txt
          curl -fsS --retry 3 --retry-all-errors --max-time 25 https://fronteraeval.org/sitemap.xml -o /tmp/sitemap.xml
          curl -fsS --retry 3 --retry-all-errors --max-time 25 https://fronteraeval.org/social-card.png -o /tmp/social-card.png
          curl -fsS --retry 3 --retry-all-errors --max-time 25 https://fronteraeval.org/evaluations/ -o /tmp/evaluations.html
          curl -fsS --retry 3 --retry-all-errors --max-time 25 https://fronteraeval.org/topics/ -o /tmp/topics.html
          curl -fsS --retry 3 --retry-all-errors --max-time 25 https://fronteraeval.org/feed.xml -o /tmp/feed.xml
          curl -fsS --retry 3 --retry-all-errors --max-time 25 https://fronteraeval.org/llms.txt -o /tmp/llms.txt
          curl -fsS --retry 3 --retry-all-errors --max-time 25 https://fronteraeval.org/opensearch.xml -o /tmp/opensearch.xml
          curl -fsS --retry 3 --retry-all-errors --max-time 25 https://fronteraeval.org/8fc7bf2d9e114784bc660d4092ef8f35.txt -o /tmp/indexnow-key.txt

          grep -Fq '<link rel="canonical" href="https://fronteraeval.org/">' /tmp/home.html
          grep -Fq 'property="og:image" content="https://fronteraeval.org/social-card.png"' /tmp/home.html
          grep -Fq 'name="twitter:card" content="summary_large_image"' /tmp/home.html
          grep -Fq 'https://fronteraeval.org/sitemap.xml' /tmp/robots.txt
          grep -Fq '<urlset' /tmp/sitemap.xml
          grep -Fq '/evaluations/' /tmp/sitemap.xml
          grep -Fq 'Frontier AI evaluations' /tmp/evaluations.html
          grep -Fq '<feed xmlns="http://www.w3.org/2005/Atom">' /tmp/feed.xml
          grep -Fq 'documentary' /tmp/llms.txt
          grep -Fq '<OpenSearchDescription' /tmp/opensearch.xml
          grep -Fq '8fc7bf2d9e114784bc660d4092ef8f35' /tmp/indexnow-key.txt

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const png=fs.readFileSync('/tmp/social-card.png');
          if (png.toString('ascii',1,4)!=='PNG') throw new Error('Social card is not PNG');
          if (png.readUInt32BE(16)!==1200 || png.readUInt32BE(20)!==630) throw new Error('Social card is not 1200x630');
          const sitemap=fs.readFileSync('/tmp/sitemap.xml','utf8');
          const count=(sitemap.match(/<loc>/g)||[]).length;
          if (count < 300) throw new Error(`Sitemap unexpectedly small: ${count}`);
          NODE

          redirect="$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 20 https://fronteraeval.netlify.app/)"
          [[ "$redirect" == 301*https://fronteraeval.org/* ]] || { echo "Canonical-host redirect failed: $redirect"; exit 1; }

      - name: Notify participating search engines of changed URLs
        if: steps.guard.outputs.run == 'true' && steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: npm run submit:indexnow

      - name: Open or update the automated failure issue
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name }} ${{ github.event.schedule }}
        run: |
          title="Automated weekly refresh failed"
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          body="The autonomous FronteraEval refresh failed.\n\nRun: $RUN_URL\nTrigger: $TRIGGER\nTime: $(date -u +'%Y-%m-%d %H:%M:%S UTC')\n\nProduction remains on the last validated deployment."
          if [[ -n "$issue" ]]; then
            printf '%b\n' "$body" | gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body-file -
          else
            printf '%b\n' "$body" | gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file -
          fi

      - name: Close any stale automated failure issue
        if: success() && steps.guard.outputs.run == 'true'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Automated weekly refresh failed"
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$issue" ]]; then
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "The latest autonomous refresh completed and was verified in production."
          fi
