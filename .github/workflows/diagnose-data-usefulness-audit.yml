name: Diagnose and complete data usefulness audit

on:
  push:
    branches: [product/data-usefulness-audit]

permissions:
  contents: write

concurrency:
  group: diagnose-data-usefulness-audit
  cancel-in-progress: true

jobs:
  diagnose-and-apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/data-usefulness-audit
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Recover and apply reviewed patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, re
          text = Path('.github/workflows/apply-data-usefulness-audit.yml').read_text()
          match = re.search(r"echo '([^']+)' \| base64 -d \| gzip -d", text)
          if not match:
              raise SystemExit('embedded patch payload not found')
          Path('/tmp/apply_data_usefulness_patch.py').write_bytes(gzip.decompress(base64.b64decode(match.group(1))))
          PY
          python /tmp/apply_data_usefulness_patch.py

      - name: Replace retired primary-source URLs
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          build = Path('scripts/build.mjs')
          text = build.read_text()
          text = text.replace(
              'https://deepmind.google/discover/blog/evaluating-frontier-models-for-dangerous-capabilities/',
              'https://deepmind.google/frontier-safety/'
          )
          text = text.replace(
              '["agentharm","AgentHarm","UK AI Security Institute","https://github.com/ai-safety-institute/AgentHarm",',
              '["agentharm","AgentHarm","Gray Swan AI and the UK AI Security Institute","https://www.aisi.gov.uk/research/agentharm-a-benchmark-for-measuring-harmfulness-of-llm-agents",'
          )
          build.write_text(text)

          path = Path('data/source-overrides.json')
          overrides = json.loads(path.read_text())
          for key in ('inspect-family:agentharm', 'canonical:agentharm'):
              entry = overrides.get('entries', {}).get(key)
              if entry:
                  entry.pop('implementation', None)
                  entry['note'] = (
                      'AgentHarm was developed by Gray Swan AI and the UK AI Security Institute. '
                      'The previously linked GitHub repository is no longer available; the paper, '
                      'official AISI research page, dataset, and maintained Inspect implementation '
                      'remain the defensible public sources.'
                  )
          path.write_text(json.dumps(overrides, indent=2) + '\n')
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Refresh sources
        shell: bash
        run: |
          set +e
          GITHUB_TOKEN='${{ secrets.GITHUB_TOKEN }}' REFRESH_INSPECT=1 npm run refresh:sources > /tmp/refresh.log 2>&1
          code=$?
          tail -n 120 /tmp/refresh.log
          exit $code

      - name: Run deterministic quality gates
        shell: bash
        run: |
          set +e
          npm run check > /tmp/check.log 2>&1
          code=$?
          tail -n 180 /tmp/check.log
          exit $code

      - name: Audit primary-source links
        shell: bash
        env:
          SOURCE_AUDIT_CONCURRENCY: '8'
        run: |
          set +e
          npm run audit:links -- --fail-critical > /tmp/links.log 2>&1
          code=$?
          tail -n 180 /tmp/links.log
          if [ -f refresh/source-link-audit.json ]; then
            node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile('refresh/source-link-audit.json', 'utf8'));
          console.log('Confirmed critical missing sources:');
          console.log(JSON.stringify(report.critical_failures || [], null, 2));
          NODE
          fi
          exit $code

      - name: Write refresh marker
        run: node scripts/write-refresh-marker.mjs

      - name: Remove one-time workflows and commit verified tree
        run: |
          rm .github/workflows/apply-data-usefulness-audit.yml
          rm .github/workflows/diagnose-data-usefulness-audit.yml
          git config user.name 'fronteraeval-bot'
          git config user.email 'fronteraeval-bot@users.noreply.github.com'
          git add -A
          git commit -m 'Harden catalogue usefulness and source health'
          git push origin HEAD:product/data-usefulness-audit
