name: Diagnose interactive performance preview

on:
  push:
    branches: [performance/interactive-runtime]
    paths:
      - ".github/workflows/verify-performance-preview.yml"

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Wait for deploy preview
        run: |
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 15 https://deploy-preview-31--fronteraeval.netlify.app/ >/dev/null; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Diagnose interactive homepage runtime
        run: |
          npx -y lighthouse@latest https://deploy-preview-31--fronteraeval.netlify.app/ --quiet --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path=/tmp/lighthouse.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('/tmp/lighthouse.json','utf8'));
          const c=r.categories,a=r.audits;
          const scores={performance:c.performance.score,accessibility:c.accessibility.score,bestPractices:c['best-practices'].score,seo:c.seo.score};
          const boot=(a['bootup-time'].details?.items||[]).sort((x,y)=>(y.scripting||0)-(x.scripting||0)).slice(0,20);
          const tasks=(a['long-tasks']?.details?.items||[]).slice(0,20);
          const third=(a['third-party-summary']?.details?.items||[]).slice(0,20);
          console.log(JSON.stringify({scores,tbt:a['total-blocking-time'].numericValue,cls:a['cumulative-layout-shift'].numericValue,tti:a.interactive.numericValue,mainthread:a['mainthread-work-breakdown'].numericValue,boot,tasks,third},null,2));
          if((boot.find((item)=>item.url?.includes('/attribution.js'))?.scripting||0)>500) throw new Error('Attribution scripting still exceeds 500ms');
          NODE
