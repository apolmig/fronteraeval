name: Diagnose FronteraEval Lighthouse performance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-lighthouse.yml"

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Run production audits and print bottlenecks
        run: |
          npx -y lighthouse@latest https://fronteraeval.org/ --quiet --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path=/tmp/home.json
          npx -y lighthouse@latest https://fronteraeval.org/evaluations/ --quiet --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path=/tmp/catalogue.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for(const name of ['home','catalogue']){
            const r=JSON.parse(fs.readFileSync(`/tmp/${name}.json`,'utf8'));
            const c=r.categories;
            console.log(`\n=== ${name.toUpperCase()} ===`);
            console.log('scores',Object.fromEntries(Object.entries(c).map(([k,v])=>[k,v.score])));
            for(const id of ['first-contentful-paint','largest-contentful-paint','speed-index','total-blocking-time','cumulative-layout-shift','interactive','server-response-time','total-byte-weight','unused-javascript','unused-css-rules','render-blocking-resources','mainthread-work-breakdown','bootup-time','network-requests','resource-summary','dom-size']){
              const a=r.audits[id]; if(!a) continue;
              console.log(id,{score:a.score,numericValue:a.numericValue,displayValue:a.displayValue,details:a.details?.overallSavingsMs||a.details?.overallSavingsBytes||a.details?.items?.slice?.(0,8)});
            }
          }
          NODE
      - name: Remove one-time diagnostic workflow
        if: always()
        run: |
          rm .github/workflows/diagnose-lighthouse.yml
          git config user.name "fronteraeval-bot"
          git config user.email "fronteraeval-bot@users.noreply.github.com"
          git add -A
          git commit -m "Remove one-time Lighthouse diagnostic workflow" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
