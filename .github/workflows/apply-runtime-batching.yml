name: Apply FronteraEval runtime batching

on:
  push:
    branches: [performance/interactive-runtime]
    paths:
      - ".github/workflows/apply-runtime-batching.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: performance/interactive-runtime
          fetch-depth: 0
      - name: Apply runtime patch
        run: python scripts/patch-runtime.py
      - name: Remove one-time files and commit
        run: |
          rm .github/workflows/apply-runtime-batching.yml
          rm scripts/patch-runtime.py
          git config user.name 'fronteraeval-bot'
          git config user.email 'fronteraeval-bot@users.noreply.github.com'
          git add -A
          git commit -m 'Batch catalogue hydration and route enhancements'
          git push origin HEAD:performance/interactive-runtime
